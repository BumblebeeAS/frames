# RobotX 2026 Task 1 (Safe Passage) on asv5: scripts/safe_passage_node.py, action /asv5/safe_passage.
# Goal: the drone's buoys (lat/lon + state). Planning in asv5/map (ENU); the route is stop-and-go TrackPath goals.
# Buoys are located on the costmap below: no lidar topic of its own.
safe_passage_node:
  ros__parameters:
    action_name: "/asv5/safe_passage"
    costmap_topic: "/asv5/global_costmap/costmap"
    marker_topic: "/asv5/safe_passage/markers"
    global_frame_id: "asv5/map"
    base_link_frame_id: "asv5/base_link"
    track_path_action: "/asv5/track_path"
    from_ll_service: "/asv5/fromLL"
    service_timeout: 2.0

    # Layout alignment (frames/utils/buoy_align.py): the drone's buoys are shifted as one layout onto the costmap.
    # Blobs: lethal cells of the costmap, joined across small gaps; only buoy-sized ones are matched.
    join_gap: 0.6                  # lethal cells closer than this are one blob (buoys are >= 1.7 m apart)
    blob_min_extent: 0.1           # buoy-sized: longer side of the blob's bounding box (RoboBuoy 0.43 m, smeared)
    blob_max_extent: 1.2
    field_margin: 12.0             # costmap read this far beyond every position a buoy can shift to
    # Shift t: every shift on a grid is scored by how close the shifted drone buoys land to a buoy-sized blob
    max_shift: 10.0                # shifts searched: +-this in x and y
    shift_step: 0.1
    score_sigma: 0.4               # a buoy this far from a blob scores exp(-1/2); the score is the sum over buoys
    min_score: 3.5                 # a solve is accepted from this score (about the buoys landing on blobs) ...
    min_ratio: 1.5                 # ... if it is also this many times the runner-up's
    runner_up_separation: 1.0      # the runner-up is the best shift at least this far from the winner
    match_radius: 0.75             # pairs this close refine the winner (least squares) and count as matched
    # Lock: the shift is used once consecutive accepted solves agree; then it is the median of recent nearby solves
    lock_solves: 3
    lock_tolerance: 0.5            # 1.0 locked up to 1.5 m off while the costmap wobbled with localisation
    basin: 2.0                     # once locked, only shifts this close to the locked one are searched
    median_window: 10
    align_timeout: 60.0            # ALIGN holds this long for a lock, then goes on with the drone's positions as is

    # Buoy estimate E_i: nearest unclaimed buoy-sized blob within r_i of P_i = C_i + t, else P_i
    snap_radius: 1.0               # r_i
    snap_spacing_factor: 0.5       # r_i also <= this x the distance to the nearest other drone buoy
    claim_radius: 1.0              # blobs this close to a buoy already placed are off limits

    # Route (frames/utils/safe_route.py): entry loop clockwise, a transit that never passes a red to port or a
    # green to starboard and passes one of each on the right side where the field allows, exit circle
    # counterclockwise. Planned once after ALIGN, and again from the boat when a goal fails every try or a Task 4
    # request has been answered. The planner's own margins are its defaults (RouteParams).
    circle_radius: 2.5             # entry and exit circles: nominal ...
    circle_radius_min: 1.6         # ... and smallest radius
    neighbour_clearance: 1.25      # R <= nearest other buoy - this (robot radius 0.75 + 0.5)
    circle_points: 6               # goals per lap, 60 deg apart
    plan_retry_period: 2.0         # no route: planned again this long after, on the costmap of then, with no limit
    fallback_planner: true         # no full route from the lattice: the sampling planner is asked, the better route kept
    fallback_budget: 10.0          # s of sampling per ask (it stops early on a good route); its checks come on top
    lattice_every: 5               # after no route the lattice sits out the attempts between (same field, same answer)
    # What the planner is told about the field
    blob_sigma: 0.3                # position error of a buoy on its costmap blob
    predicted_sigma: 1.0           # ... of one with no blob, at its shifted drone position: a wider berth, and it
                                   # earns no pass
    unreported_margin: 4.0         # buoy-sized blobs no drone buoy sits on count this far around the drone's buoys:
                                   # kept clear of, colourless
    blob_cell_radius: 0.9          # lethal cells this close to a buoy-sized blob are that buoy, not an obstacle
    obstacle_range: 14.0           # lethal cells further than this from every buoy are left out

    # TrackPath (replan tracker), one goal at a time, specified_heading false, heading of the next leg
    goal_tolerance: 1.0
    goal_stabilize: 0
    goal_sample_radius: 0.5        # tracker moves a blocked goal this far; < 0.25 (its sample_spacing) does nothing
    max_replans: 5
    goal_timeout: 60.0             # our backstop per goal, plus its distance / goal_speed
    goal_speed: 0.3                # m/s (the boat makes about 0.44)

    # Retries
    point_retries: 2               # a failed goal is sent again this many times, then the node plans again from
                                   # where the boat is

    # Task 4 Core (goal respond_to_assistance): an AssistanceRequest for this vehicle type interrupts the goal.
    # IncidentAck + SetTask go out, the boat drives to the position, sends the ReadinessReport, holds for the
    # ReadinessConfirm naming that report, then drives back to where it was interrupted, SetTask back, and PLAN.
    hold_idle_requests: true       # a request with no goal answering is held for the next goal ...
    assistance_max_age: 30.0       # ... which discards it if it was received more than this long before the
                                   # node starts on it (by this node's clock, from when it arrived here). 0: no limit
    clear_assistance_service: "/asv5/safe_passage/clear_assistance"  # Trigger: drops it (the tree, at run start)
    vehicle_id: "USV1"             # as the OCS names this vehicle: ReadinessConfirms for another id are ignored
    vehicle_type: "usv"            # AssistanceRequests for another type are ignored
    assistance_topic: "/asv5/task4/assistance_request"        # from the OCS bridge, not latched
    readiness_confirm_topic: "/asv5/task4/readiness_confirm"  # from the OCS bridge, not latched
    incident_ack_action: "/asv5/report/incident_ack"
    readiness_action: "/asv5/report/readiness"
    set_task_action: "/asv5/set_task"
    incident_task: "dynamic_incident"   # heartbeat task while answering
    resume_task: "safe_passage"         # and after
    incident_sample_radius: 0.5    # the tracker may move a blocked station this far
    incident_tolerance: 1.0        # on station within this of the requested position
    incident_goal_timeout: 300.0   # per try at reaching it (goal_timeout is sized for circle points)
    incident_goal_retries: 2       # more tries at reaching it; unreached: no ReadinessReport, back to the buoys
    incident_return: true          # afterwards drive back to where the boat was interrupted before planning again
                                   # (planned from outside the field, 1 layout in 10 had no route)
    readiness_confirm_timeout: 900.0   # hold this long for the ReadinessConfirm, then resume anyway
    report_retries: 3              # more tries for IncidentAck, SetTask and ReadinessReport
    report_timeout: 40.0           # per try; the bridge gives the OCS 30 s
